<body>
    <script>
        let f1=function(year){
            if(year%4==0&&year%100!=0){
                 return "yes its leap year";
            }
            else{
                return "not leap";
            }
        }
        a=prompt("enter a number:");
       f=f1(a)
       document.write(f)
    </script>
